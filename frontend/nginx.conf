# LLMChatRAG 前端容器 Nginx 配置
# 前端部署在 /llmchatrag/ 子路径，API 代理 /llmchatrag/api/ → backend-chatrag:8000

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # 关键：关闭绝对重定向，使 Nginx 重定向只返回路径（不含 http://）
    # 浏览器会自动使用当前协议（HTTPS），避免 Mixed Content
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    # ── Gzip 压缩 ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── 前端静态文件（子路径 /llmchatrag/）──────────
    # 无尾斜杠 → 301 到带尾斜杠（避免 location /llmchatrag/ 不匹配）
    location = /llmchatrag {
        return 301 /llmchatrag/;
    }
    location /llmchatrag/ {
        alias /var/www/llmchatrag/;
        index index.html;
        try_files $uri $uri/ /llmchatrag/index.html;

        # 确保 JS/CSS 返回正确的 Content-Type
        location ~* \.(js|css)$ {
            alias /var/www/llmchatrag/;
            add_header Content-Type "application/javascript; charset=utf-8";
        }
    }

    # ── API 反代 → 后端微服务（服务名 backend-chatrag，docker-compose 与 K8s 统一）──
    # proxy_pass 末尾带斜杠，自动去除 location 匹配部分：
    #   /llmchatrag/api/xxx → backend-chatrag:8000/api/xxx
    location /llmchatrag/api/ {
        client_max_body_size 10M;

        proxy_pass http://backend-chatrag:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 关键：传递 HTTPS 协议信息给后端，避免生成 http:// 链接
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # ====== SSE 流式输出支持 ======
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── SPA 根路径重定向到子路径 ───────────────────
    location = / {
        return 302 /llmchatrag/;
    }

    # ── 带哈希的静态资源长缓存 ──────────────────────
    location ~* /llmchatrag/.*\.(js|css|woff2?|png|jpe?g|gif|ico|svg)$ {
        alias /var/www/llmchatrag/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}