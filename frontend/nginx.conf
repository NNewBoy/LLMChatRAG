# LLMChatRAG 前端容器 Nginx 配置
# 前端部署在 /llmchatrag/ 子路径，API 代理 /llmchatrag/api/ → backend:8000

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── Gzip 压缩 ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── 前端静态文件（子路径 /llmchatrag/）──────────
    location /llmchatrag/ {
        alias /var/www/llmchatrag/;
        index index.html;
        try_files $uri $uri/ /llmchatrag/index.html;
    }

    # ── API 反代 → 后端微服务（Docker/K8s 网络内服务名: backend）──
    # proxy_pass 末尾带斜杠，自动去除 location 匹配部分：
    #   /llmchatrag/api/xxx → backend:8000/api/xxx
    location /llmchatrag/api/ {
        client_max_body_size 10M;

        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ====== SSE 流式输出支持 ======
        # 不设 proxy_buffering off，普通 API 请求保持默认缓冲快速返回；
        # SSE 响应由后端 X-Accel-Buffering: no 头自动禁用缓冲
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── SPA 根路径重定向到子路径 ───────────────────
    location = / {
        return 302 /llmchatrag/;
    }

    # ── 带哈希的静态资源长缓存 ──────────────────────
    location ~* /llmchatrag/.*\.(js|css|woff2?|png|jpe?g|gif|ico|svg)$ {
        alias /var/www/llmchatrag/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}