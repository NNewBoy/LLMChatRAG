# LLMChatRAG 前端容器 Nginx 配置
# 前端部署在 /llmchatrag/ 子路径，API 代理 /llmchatrag/api → backend-chatrag:8000

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # 关键：关闭绝对重定向，使 Nginx 重定向只返回路径（不含 http://）
    # 浏览器会自动使用当前协议（HTTPS），避免 Mixed Content
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    # ── Gzip 压缩 ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── API 反代 → 后端微服务 ──────────────────────
    # location 无尾斜杠前缀匹配 /llmchatrag/api 和 /llmchatrag/api/xxx
    # rewrite 去掉 /llmchatrag 前缀后转发：
    #   /llmchatrag/api/models → /api/models
    #   /llmchatrag/api/chat/conversations → /api/chat/conversations
    location /llmchatrag/api {
        rewrite ^/llmchatrag/api/(.*)$ /api/$1 break;
        proxy_pass http://backend-chatrag:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE 流式输出支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 无尾斜杠 → 301 到带尾斜杠 ──────────────────
    location = /llmchatrag {
        return 301 /llmchatrag/;
    }

    # ── 前端静态文件（子路径 /llmchatrag/）──────────
    # 用 root 而非 alias，避免尾斜杠重定向问题
    # dist 内容直接放在 /var/www/llmchatrag/ 下，路径自然对齐
    location /llmchatrag/ {
        root /var/www;
        index index.html;

        # 静态资源直接返回文件，不匹配的路径 fallback 到 index.html（SPA 路由）
        try_files $uri $uri/ /llmchatrag/index.html;

        # 静态资源长缓存
        location ~* \.(js|css|woff2?|png|jpe?g|gif|ico|svg)$ {
            root /var/www;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── SPA 根路径重定向到子路径 ───────────────────
    location = / {
        return 302 /llmchatrag/;
    }
}