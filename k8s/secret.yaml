# LLMChatRAG 敏感配置模板（API Key 等）
# ⚠️ 此文件为模板，占位符 sk-xxxxxxxx 不可直接用于生产！
# ⚠️ 已加入 .gitignore，修改为真实值后不会被提交
#
# 更新方式二选一：
#   方式一（推荐）：手动在 K8s Master 执行下方命令
#   方式二：通过 Jenkins Credentials 注入（见 DEPLOY_UBUNTU.md §12.8）

apiVersion: v1
kind: Secret
metadata:
  name: chatrag-secret
  namespace: app
type: Opaque
stringData:
  LLM_API_KEY: "sk-xxxxxxxxxxxxxxxx"
  LLM_API_BASE_URL: "https://api.deepseek.com/v1"
  LLM_MODEL: "deepseek-chat"
  EMBEDDING_API_KEY: "sk-xxxxxxxx"
  EMBEDDING_API_BASE_URL: "https://api.siliconflow.cn/v1"
  EMBEDDING_MODEL: "BAAI/bge-large-zh-v1.5"