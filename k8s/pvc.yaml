# LLMChatRAG 持久化存储
# 注意：Namespace 由 LLMBLOG 的 k8s/namespace.yaml 共用（namespace=app）
# PV 命名加 chatrag- 前缀，hostPath 用 /data/chatrag/，避免与 LLMBLOG 的 /data/llmblog/ 冲突
# 部署前需在 k8s-node1 创建目录：
#   sudo mkdir -p /data/chatrag/db /data/chatrag/faiss /data/chatrag/uploads
#   sudo chmod -R 777 /data/chatrag

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-chatrag-db
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - {key: kubernetes.io/hostname, operator: In, values: ["k8s-node1"]}
  hostPath:
    path: /data/chatrag/db
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-chatrag-faiss
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - {key: kubernetes.io/hostname, operator: In, values: ["k8s-node1"]}
  hostPath:
    path: /data/chatrag/faiss
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-chatrag-uploads
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - {key: kubernetes.io/hostname, operator: In, values: ["k8s-node1"]}
  hostPath:
    path: /data/chatrag/uploads
    type: DirectoryOrCreate

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatrag-db-data
  namespace: app
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatrag-faiss-data
  namespace: app
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatrag-uploads
  namespace: app
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi