apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatrag-ingress
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: www.newboy.ren
    http:
      paths:
      # 前端子路径 /llmchatrag/ → frontend-chatrag
      - path: /llmchatrag
        pathType: Prefix
        backend:
          service:
            name: frontend-chatrag
            port: {number: 80}
      # API 子路径 /llmchatrag/api → backend-chatrag
      - path: /llmchatrag/api
        pathType: Prefix
        backend:
          service:
            name: backend-chatrag
            port: {number: 8000}