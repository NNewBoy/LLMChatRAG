apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatrag-ingress
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: www.newboy.ren
    http:
      paths:
      # API 子路径 → frontend-chatrag（由前端 Nginx rewrite 去前缀后代理到 backend-chatrag）
      # 必须在 /llmchatrag 之前，Ingress 按最长前缀优先匹配
      - path: /llmchatrag/api
        pathType: Prefix
        backend:
          service:
            name: frontend-chatrag
            port: {number: 80}
      # 前端子路径 /llmchatrag → frontend-chatrag
      - path: /llmchatrag
        pathType: Prefix
        backend:
          service:
            name: frontend-chatrag
            port: {number: 80}