apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-chatrag
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker-chatrag
  progressDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: celery-worker-chatrag
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1   # 固定到有 PV 数据的节点
      imagePullSecrets:
      - name: aliyun-acr-secret
      containers:
      - name: worker
        image: crpi-v27gqzero2fjya51.cn-guangzhou.personal.cr.aliyuncs.com/llmproject/backend_chatrag:latest
        command: ["celery"]
        args: ["-A", "celery_app", "worker", "--loglevel=info", "--concurrency=1"]
        envFrom:
        - configMapRef: {name: chatrag-config}
        - secretRef: {name: chatrag-secret}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: 1000m, memory: 1Gi}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: faiss
          mountPath: /app/data/faiss
        - name: uploads
          mountPath: /app/data/uploads
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: chatrag-db-data}
      - name: faiss
        persistentVolumeClaim: {claimName: chatrag-faiss-data}
      - name: uploads
        persistentVolumeClaim: {claimName: chatrag-uploads}