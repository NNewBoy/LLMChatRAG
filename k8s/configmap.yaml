# LLMChatRAG 配置
# 注意：Namespace 与 Redis 由 LLMBLOG 的 k8s/ 共用（namespace=app, Service=redis:6379）
# Redis DB 分配：LLMBLOG 用 DB 0/1，LLMChatRAG 用 DB 2/3

apiVersion: v1
kind: ConfigMap
metadata:
  name: chatrag-config
  namespace: app
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CELERY_BROKER_DB: "2"
  CELERY_BACKEND_DB: "3"
  CELERY_QUEUE: "chatrag_queue"
  LOG_LEVEL: "INFO"
  SQLITE_DB_PATH: "./data/sqlite/chatrag.db"
  FAISS_DB_PATH: "./data/faiss/"
  AGENT_FRAMEWORK: "langchain"
  EMBEDDING_PROVIDER: "siliconflow"
  CORS_ORIGINS: "http://localhost,http://127.0.0.1"

---
apiVersion: v1
kind: Secret
metadata:
  name: chatrag-secret
  namespace: app
type: Opaque
stringData:
  # 生产环境必须填入真实 API Key
  LLM_API_KEY: "sk-xxxxxxxxxxxxxxxx"
  LLM_API_BASE_URL: "https://api.deepseek.com/v1"
  LLM_MODEL: "deepseek-chat"
  EMBEDDING_API_KEY: "sk-xxxxxxxx"
  EMBEDDING_API_BASE_URL: "https://api.siliconflow.cn/v1"
  EMBEDDING_MODEL: "BAAI/bge-large-zh-v1.5"