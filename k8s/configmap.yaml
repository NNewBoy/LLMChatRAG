# LLMChatRAG 非敏感配置（可安全提交 Git，Jenkins 自动 apply）
# 注意：Namespace 与 Redis 由 LLMBLOG 的 k8s/ 共用（namespace=app, Service=redis:6379）
# Redis DB 分配：LLMBLOG 用 DB 0/1，LLMChatRAG 用 DB 2/3

apiVersion: v1
kind: ConfigMap
metadata:
  name: chatrag-config
  namespace: app
data:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CELERY_BROKER_DB: "2"
  CELERY_BACKEND_DB: "3"
  CELERY_QUEUE: "chatrag_queue"
  LOG_LEVEL: "INFO"
  SQLITE_DB_PATH: "./data/sqlite/chatrag.db"
  FAISS_DB_PATH: "./data/faiss/"
  AGENT_FRAMEWORK: "langchain"
  EMBEDDING_PROVIDER: "siliconflow"
  CORS_ORIGINS: "http://localhost,http://127.0.0.1"