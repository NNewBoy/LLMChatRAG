apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1   # 固定到有 PV 数据的节点（SQLite hostPath 不可跨节点共享）
      imagePullSecrets:
      - name: aliyun-acr-secret
      containers:
      - name: backend
        image: crpi-v27gqzero2fjya51.cn-guangzhou.personal.cr.aliyuncs.com/chatrag/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef: {name: app-config}
        - secretRef: {name: app-secret}
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: 1000m, memory: 1Gi}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: faiss
          mountPath: /app/data/faiss
        - name: uploads
          mountPath: /app/data/uploads
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: backend-data}
      - name: faiss
        persistentVolumeClaim: {claimName: faiss-data}
      - name: uploads
        persistentVolumeClaim: {claimName: backend-uploads}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
spec:
  selector: {app: backend}
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP