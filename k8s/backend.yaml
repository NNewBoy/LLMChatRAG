apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-chatrag
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-chatrag
  progressDeadlineSeconds: 600
  # Recreate 策略：先删旧 Pod 再创建新 Pod
  # 原因：PVC 为 ReadWriteOnce + 单节点 nodeSelector，新旧 Pod 无法并存
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: backend-chatrag
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1   # 固定到有 PV 数据的节点
      imagePullSecrets:
      - name: aliyun-acr-secret
      containers:
      - name: backend-chatrag
        image: crpi-v27gqzero2fjya51.cn-guangzhou.personal.cr.aliyuncs.com/llmproject/backend_chatrag:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef: {name: chatrag-config}
        - secretRef: {name: chatrag-secret}
        # startupProbe：给慢启动容器充足时间（llama_index + faiss 导入可能需要 60s+）
        # 在 startupProbe 成功之前，liveness/readiness Probe 不会执行
        startupProbe:
          httpGet: {path: /health, port: 8000}
          failureThreshold: 30   # 30 次 × 10s = 最多等 5 分钟
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 2000m, memory: 2Gi}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: faiss
          mountPath: /app/data/faiss
        - name: uploads
          mountPath: /app/data/uploads
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: chatrag-db-data}
      - name: faiss
        persistentVolumeClaim: {claimName: chatrag-faiss-data}
      - name: uploads
        persistentVolumeClaim: {claimName: chatrag-uploads}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-chatrag
  namespace: app
spec:
  selector: {app: backend-chatrag}
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP