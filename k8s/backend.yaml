apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-chatrag
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-chatrag
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels:
        app: backend-chatrag
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-node1   # 固定到有 PV 数据的节点
      imagePullSecrets:
      - name: aliyun-acr-secret
      containers:
      - name: backend-chatrag
        image: crpi-v27gqzero2fjya51.cn-guangzhou.personal.cr.aliyuncs.com/llmproject/backend_chatrag:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef: {name: chatrag-config}
        - secretRef: {name: chatrag-secret}
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: 1000m, memory: 1Gi}
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: faiss
          mountPath: /app/data/faiss
        - name: uploads
          mountPath: /app/data/uploads
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: chatrag-db-data}
      - name: faiss
        persistentVolumeClaim: {claimName: chatrag-faiss-data}
      - name: uploads
        persistentVolumeClaim: {claimName: chatrag-uploads}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-chatrag
  namespace: app
spec:
  selector: {app: backend-chatrag}
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP