# LLMChatRAG Nginx 生产配置（裸金属模式）
# 前端静态文件 → /var/www/llmchatrag
# 后端 FastAPI → 127.0.0.1:8003
# 前端部署在子路径 /llmchatrag/，API 代理 /llmchatrag/api/ → 后端 /api/

server {
    listen 80;
    server_name _;

    # 文档上传大小限制（RAG 文档可能较大，按需调整）
    client_max_body_size 10M;

    # ── Gzip 压缩 ──────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ── 前端静态文件（子路径 /llmchatrag/）──────────
    location /llmchatrag {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /llmchatrag/index.html;
    }

    # ── API 代理（含 SSE 流式支持）──────────────────
    # 前端请求 /llmchatrag/api/xxx，proxy_pass 末尾带斜杠会替换 location 匹配部分，
    # 即 /llmchatrag/api/models -> http://127.0.0.1:8003/api/models
    location /llmchatrag/api/ {
        client_max_body_size 10M;

        proxy_pass http://127.0.0.1:8003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ====== SSE 流式输出支持 ======
        # 不在此设 proxy_buffering off，普通 API 请求保持默认缓冲快速返回；
        # SSE 响应由后端 X-Accel-Buffering: no 头自动禁用缓冲
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 前端静态资源缓存 ─────────────────────────────
    location ~* /llmchatrag/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 根路径重定向到子路径 ───────────────────
    location = / {
        return 302 /llmchatrag/;
    }
}